<title>Not found · carpetonerd</title>
<script>
// Old addresses keep working: the tools' GitHub names before the move,
// and /safety/... deep links. Anything else shows "not found".
(function () {
  var moved = {
    'rdco-tracker': '/tracker',
    'sample-tracker': '/samples',
    'rdco-insurance': '/insurance',
    'safety': 'https://safety.carpetonerd.ca'
  };
  var parts = location.pathname.split('/');
  var to = moved[(parts[1] || '').toLowerCase()];
  if (to) {
    var rest = parts.slice(2).join('/');
    location.replace(to + '/' + rest + location.search + location.hash);
  }
})();
</script>
